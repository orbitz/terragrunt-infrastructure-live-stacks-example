# ---------------------------------------------------------------------------------------------------------------------
# STATEGRAPH ORCHESTRATION CONFIGURATION
# Each environment is one root module under `environments/<name>`. Stategraph keeps its state (Infrastructure as a
# Database), so there is no S3 bucket and no backend block. Stategraph plans only the resources that a change reaches,
# so a large root module per environment stays fast to plan.
#
# This file does the work that Terragrunt did in this repository:
#
#   Terragrunt                                   Here
#   ------------------------------------------   ---------------------------------------------------------------------
#   mise.toml (opentofu version)                  engine.tf_version
#   root.hcl remote_state + generate backend.tf   engine: stategraph, and stategraph.json in each environment directory
#   account.hcl / region.hcl                      stacks.names.<environment>.variables
#   autoinclude dependency blocks                 not needed: the components are module calls in one root module
#   mark_glob_as_read("src/**")                   dirs.<environments>.when_modified.file_patterns
#   before_hook "package"                         definitions.package (a run step before plan and apply)
#   terragrunt run --all plan / apply             autoplan on each pull request, `stategraph plan` / `stategraph apply`
#
# DEMO: the modules use `terraform_data` resources in place of AWS resources. Thus no AWS account and no AWS
# credentials are necessary.
#
# The runner needs the GitHub Actions secrets STATEGRAPH_API_BASE, STATEGRAPH_API_KEY and STATEGRAPH_TENANT_ID.
# ---------------------------------------------------------------------------------------------------------------------

engine:
  name: stategraph
  tf_cmd: tofu
  tf_version: '1.13.1'

# The indexer reads the `module` blocks of each root module, and follows local module sources. Thus:
#   - A directory that a `module` block references is a module. It never plans or applies on its own.
#   - An environment plans when a `*.tf` file of a module that it uses changes.
# The `dirs` section thus does not list the modules. The indexer adds only `*.tf` files of modules. Other files that
# an environment reads, such as the handler source, must be in `file_patterns`.
indexer:
  enabled: true

definitions:
  # Replaces the `before_hook "package"` of the js-lambda-stateful-service unit. It runs in the environment
  # directory, and writes handler.zip there. The root module reads it as `${path.module}/handler.zip`.
  package: &package
    type: run
    cmd:
      - 'python3'
      - '${TERRATEAM_ROOT}/scripts/package-lambda.py'
      - '${TERRATEAM_ROOT}/modules/stateful-lambda-service/service/src'
      - 'handler.zip'

# A glob key in `dirs` matches file paths. The directory of a matching file gets the entry. Thus each key ends in
# `/*.tf`.
dirs:
  'environments/*/*.tf':
    when_modified:
      file_patterns:
        - '${DIR}/*.tf'
        - '${DIR}/stategraph.json'
        - 'modules/stateful-lambda-service/service/src/**'
        - 'scripts/package-lambda.py'

# One stack per environment. Each stack replaces the account.hcl and region.hcl files of that environment.
# The account IDs are only used to make the ARNs of the demo resources. Any value works.
stacks:
  names:
    non-prod:
      tag_query: 'dir:environments/non-prod'
      variables:
        TF_VAR_aws_account_id: '123456789012'
        TF_VAR_aws_region: 'us-east-1'

    prod:
      tag_query: 'dir:environments/prod'
      variables:
        TF_VAR_aws_account_id: '210987654321'
        TF_VAR_aws_region: 'us-east-1'
      rules:
        # DIVERGENCE FROM TERRAGRUNT: Terragrunt had no order between the non-prod and prod stacks.
        # `terragrunt run --all apply` at the repository root applied both, in any order. This rule adds an order:
        # when a pull request changes both environments, prod applies only after non-prod applied.
        apply_after:
          - non-prod

# The `init` step of the stategraph engine checks the STATEGRAPH_* secrets and stategraph.json. `stategraph tf plan`
# reads the TF_VAR_* stack variables.
workflows:
  - tag_query: ''
    plan:
      - type: init
      - *package
      - type: plan
    apply:
      - type: init
      - *package
      - type: apply
